name: E-Commerce synthetic SQL validation

on:
  push:
    paths:
      - 'projects/ecommerce-revenue-operations-analytics/local_validation/**'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/marts/business/mart_revenue_financial_reconciliation.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/marts/business/mart_customer_experience_reviews.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/marts/core/fct_orders.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/intermediate/int_order_items_summary.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/intermediate/int_order_payments_summary.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/intermediate/int_order_financial_reconciliation.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/intermediate/int_orders_lifecycle.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/intermediate/int_order_reviews_summary.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/staging/stg_orders.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/staging/stg_order_items.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/staging/stg_order_payments.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/staging/stg_order_reviews.sql'
      - '.github/workflows/ecommerce-local-validation.yml'
  pull_request:
    paths:
      - 'projects/ecommerce-revenue-operations-analytics/local_validation/**'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/marts/business/mart_revenue_financial_reconciliation.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/marts/business/mart_customer_experience_reviews.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/marts/core/fct_orders.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/intermediate/int_order_items_summary.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/intermediate/int_order_payments_summary.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/intermediate/int_order_financial_reconciliation.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/intermediate/int_orders_lifecycle.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/intermediate/int_order_reviews_summary.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/staging/stg_orders.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/staging/stg_order_items.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/staging/stg_order_payments.sql'
      - 'projects/ecommerce-revenue-operations-analytics/dbt/ecommerce_revenue_operations/models/staging/stg_order_reviews.sql'
      - '.github/workflows/ecommerce-local-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-duckdb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install local test dependency
        run: python -m pip install 'duckdb==1.4.1'
      - name: Test synthetic monthly counts
        run: python projects/ecommerce-revenue-operations-analytics/local_validation/check_monthly_reconciliation.py
      - name: Test original mart SQL on synthetic data
        run: python projects/ecommerce-revenue-operations-analytics/local_validation/check_original_mart.py
      - name: Test three original intermediate models with synthetic DuckDB
        run: python projects/ecommerce-revenue-operations-analytics/local_validation/check_original_intermediate_reconciliation.py
      - name: Test original order-lifecycle SELECT in full-refresh mode
        run: python projects/ecommerce-revenue-operations-analytics/local_validation/check_original_lifecycle.py
      - name: Test original fact orders JOIN and grain on synthetic DuckDB
        run: python projects/ecommerce-revenue-operations-analytics/local_validation/check_original_fact_orders.py
      - name: Test original review summary aggregates on synthetic DuckDB
        run: python projects/ecommerce-revenue-operations-analytics/local_validation/check_original_reviews_summary.py
      - name: Test integrated 12-model synthetic RAW-to-two-marts DuckDB pipeline
        run: python projects/ecommerce-revenue-operations-analytics/local_validation/check_integrated_financial_pipeline.py
      - name: Test local incremental watermark and MERGE idempotency semantics
        run: python projects/ecommerce-revenue-operations-analytics/local_validation/check_local_incremental_semantics.py
      - name: Test backdated order reconciliation and deletion guard
        run: python projects/ecommerce-revenue-operations-analytics/local_validation/check_local_backdated_reconciliation.py
      - name: Test fail-closed reconciliation guards and transaction rollback
        run: python projects/ecommerce-revenue-operations-analytics/local_validation/check_reconciliation_contract_guards.py
      - name: Test two-connection synthetic DuckDB snapshot and write conflicts
        run: python projects/ecommerce-revenue-operations-analytics/local_validation/check_local_concurrent_transactions.py
