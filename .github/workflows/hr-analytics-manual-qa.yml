name: HR Analytics — opt-in full-source QA

# Manual-only. No automatic Actions minutes and no publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-full-source:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, federica-home]
    defaults:
      run:
        shell: bash
        working-directory: projects/hr-analytics-employee-attrition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fixture-based and full-source regression tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate clean HR CSV outside the repository
        run: |
          python python/clean_employee_attrition.py \
            --output "$RUNNER_TEMP/employee_attrition_clean.csv" \
            --report "$RUNNER_TEMP/source_quality_report.json"
          python -c "import os; from pathlib import Path; a=Path(os.environ['RUNNER_TEMP'])/'employee_attrition_clean.csv'; b=Path('data/clean/employee_attrition_clean.csv'); assert a.read_bytes()==b.read_bytes(), 'Clean HR CSV mismatch'"
      - name: Regenerate grouped HR source outside the repository
        run: |
          python python/build_dashboard_source.py \
            --output "$RUNNER_TEMP/hr_dashboard_group_metrics.csv"
          python -c "import os; from pathlib import Path; a=Path(os.environ['RUNNER_TEMP'])/'hr_dashboard_group_metrics.csv'; b=Path('excel/hr_dashboard_group_metrics.csv'); assert a.read_bytes()==b.read_bytes(), 'HR dashboard CSV mismatch'"
      - name: Read-only XLSX package and worksheet integrity QA
        run: python python/verify_workbook_structure.py
      - name: Reconcile all static XLSX figures with CSV and raw provenance
        run: python python/verify_workbook_parity.py
