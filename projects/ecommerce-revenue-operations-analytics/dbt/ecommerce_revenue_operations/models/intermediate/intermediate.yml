  - name: int_orders_lifecycle
    description: >
      Order-level lifecycle model preserving the complete order universe while
      exposing missing lifecycle timestamps, temporal sequence anomalies and
      duration metrics only where timestamp sequences are valid.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null

      - name: order_status
        data_tests:
          - not_null

      - name: order_purchase_timestamp
        data_tests:
          - not_null

      - name: is_approval_missing
        data_tests:
          - not_null

      - name: is_carrier_timestamp_missing
        data_tests:
          - not_null

      - name: is_customer_delivery_timestamp_missing
        data_tests:
          - not_null

      - name: is_delivered_order_missing_approval
        data_tests:
          - not_null

      - name: is_delivered_order_missing_carrier_timestamp
        data_tests:
          - not_null

      - name: is_delivered_order_missing_customer_delivery_timestamp
        data_tests:
          - not_null

      - name: approval_before_purchase
        data_tests:
          - not_null

      - name: carrier_before_approval
        data_tests:
          - not_null

      - name: customer_delivery_before_carrier
        data_tests:
          - not_null

      - name: customer_delivery_before_purchase
        data_tests:
          - not_null

      - name: estimated_delivery_before_purchase
        data_tests:
          - not_null

      - name: has_temporal_sequence_anomaly
        data_tests:
          - not_null
