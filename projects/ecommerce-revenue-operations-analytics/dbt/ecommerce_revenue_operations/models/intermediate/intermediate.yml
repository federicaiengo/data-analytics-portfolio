version: 2

models:

  - name: int_geolocation_deduplicated
    description: >
      Exact-deduplicated geolocation observations preserving the remaining
      source-level geographic granularity.
    columns:
      - name: geolocation_zip_code_prefix
        data_tests:
          - not_null

      - name: geolocation_lat
        data_tests:
          - not_null

      - name: geolocation_lng
        data_tests:
          - not_null


  - name: int_geolocation_zip
    description: >
      Controlled one-row-per-ZIP geographic representation used to prevent
      row multiplication in downstream joins.
    columns:
      - name: geolocation_zip_code_prefix
        data_tests:
          - not_null
          - unique

      - name: geolocation_lat
        data_tests:
          - not_null

      - name: geolocation_lng
        data_tests:
          - not_null

      - name: geolocation_city
        data_tests:
          - not_null

      - name: geolocation_state
        data_tests:
          - not_null

      - name: geolocation_observation_count
        data_tests:
          - not_null