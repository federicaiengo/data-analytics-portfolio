version: 2

models:

  - name: int_geolocation_deduplicated
    description: >
      Exact-deduplicated geolocation observations preserving the remaining
      source-level geographic granularity.
    columns:
      - name: geolocation_zip_code_prefix
        data_tests:
          - not_null

      - name: geolocation_lat
        data_tests:
          - not_null

      - name: geolocation_lng
        data_tests:
          - not_null


  - name: int_geolocation_zip
    description: >
      Controlled one-row-per-ZIP geographic representation used to prevent
      row multiplication in downstream joins.
    columns:
      - name: geolocation_zip_code_prefix
        data_tests:
          - not_null
          - unique

      - name: geolocation_lat
        data_tests:
          - not_null

      - name: geolocation_lng
        data_tests:
          - not_null

      - name: geolocation_city
        data_tests:
          - not_null

      - name: geolocation_state
        data_tests:
          - not_null

      - name: geolocation_observation_count
        data_tests:
          - not_null


  - name: int_order_items_summary
    description: >
      Order-level aggregation of item, product, seller and financial values,
      preventing row multiplication in downstream order-level joins.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: order_item_count
        data_tests:
          - not_null

      - name: distinct_product_count
        data_tests:
          - not_null

      - name: distinct_seller_count
        data_tests:
          - not_null

      - name: item_sales_value
        data_tests:
          - not_null

      - name: freight_value
        data_tests:
          - not_null

      - name: item_plus_freight_value
        data_tests:
          - not_null


  - name: int_order_payments_summary
    description: >
      Order-level payment aggregation used to preserve one-row-per-order grain
      and prevent row multiplication in downstream joins.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: payment_record_count
        data_tests:
          - not_null

      - name: distinct_payment_type_count
        data_tests:
          - not_null

      - name: max_payment_installments
        data_tests:
          - not_null

      - name: payment_value
        data_tests:
          - not_null


  - name: int_order_financial_reconciliation
    description: >
      Order-level reconciliation model preserving the complete order universe
      while comparing aggregated payment value against aggregated item sales
      plus freight. Missing transactional summaries and financial discrepancies
      remain explicitly observable rather than being silently replaced.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null

      - name: order_status
        data_tests:
          - not_null

      - name: missing_item_summary
        data_tests:
          - not_null

      - name: missing_payment_summary
        data_tests:
          - not_null
